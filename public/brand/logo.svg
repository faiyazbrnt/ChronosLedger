<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Squircle background gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#73e6cb"/>
      <stop offset="35%" stop-color="#3ebfa4"/>
      <stop offset="70%" stop-color="#198275"/>
      <stop offset="100%" stop-color="#0a4d46"/>
    </linearGradient>

    <!-- Top highlight overlay -->
    <linearGradient id="topHighlight" x1="256" y1="32" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Clock face gradient -->
    <radialGradient id="clockDial" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0fbf8"/>
      <stop offset="100%" stop-color="#d8f4ed"/>
    </radialGradient>

    <!-- Clock bezel gradient -->
    <linearGradient id="clockBezel" x1="160" y1="130" x2="352" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55deb5"/>
      <stop offset="50%" stop-color="#23a487"/>
      <stop offset="100%" stop-color="#105f4e"/>
    </linearGradient>

    <!-- Column marble gradients -->
    <linearGradient id="marbleLight" x1="190" y1="100" x2="322" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#d4e8e4"/>
    </linearGradient>

    <linearGradient id="marbleShaft" x1="210" y1="280" x2="302" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f2faf8"/>
      <stop offset="70%" stop-color="#d8ece7"/>
      <stop offset="100%" stop-color="#bddad3"/>
    </linearGradient>

    <!-- Gold coin gradient -->
    <linearGradient id="goldCoin" x1="320" y1="390" x2="355" y2="435" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="30%" stop-color="#f3cb42"/>
      <stop offset="70%" stop-color="#d8981b"/>
      <stop offset="100%" stop-color="#9a6008"/>
    </linearGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6f4e2"/>
      <stop offset="100%" stop-color="#53c9aa"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#052c28" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base (Curvature match) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#topHighlight)" />

  <!-- Background Analytics Grid & Bars (Subtle) -->
  <g opacity="0.18">
    <!-- Bar chart columns behind pillar -->
    <rect x="356" y="240" width="22" height="90" rx="4" fill="#ffffff"/>
    <rect x="384" y="200" width="22" height="130" rx="4" fill="#ffffff"/>
    <rect x="412" y="160" width="22" height="170" rx="4" fill="#ffffff"/>
    <rect x="78" y="260" width="22" height="70" rx="4" fill="#ffffff"/>
    <rect x="106" y="220" width="22" height="110" rx="4" fill="#ffffff"/>
    <rect x="134" y="250" width="22" height="80" rx="4" fill="#ffffff"/>

    <!-- Ledger spreadsheet horizontal gridlines -->
    <line x1="140" y1="370" x2="372" y2="370" stroke="#ffffff" stroke-width="2"/>
    <line x1="140" y1="390" x2="372" y2="390" stroke="#ffffff" stroke-width="2"/>
    <line x1="140" y1="410" x2="372" y2="410" stroke="#ffffff" stroke-width="2"/>
    <line x1="180" y1="360" x2="180" y2="420" stroke="#ffffff" stroke-width="2"/>
    <line x1="220" y1="360" x2="220" y2="420" stroke="#ffffff" stroke-width="2"/>
    <line x1="292" y1="360" x2="292" y2="420" stroke="#ffffff" stroke-width="2"/>
    <line x1="332" y1="360" x2="332" y2="420" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- MAIN EMBLEM GROUP WITH SHADOW -->
  <g filter="url(#softShadow)">
    <!-- Laurel Wreath Leaves (Left) -->
    <g fill="url(#leafGrad)">
      <path d="M190 190 C165 170 145 190 155 215 C165 210 180 200 190 190 Z"/>
      <path d="M178 220 C150 205 135 225 148 248 C160 242 172 232 178 220 Z"/>
      <path d="M172 255 C144 245 132 268 148 288 C160 280 170 268 172 255 Z"/>
      <path d="M174 290 C150 285 140 310 158 326 C168 316 174 304 174 290 Z"/>
      <path d="M185 324 C165 324 160 348 180 358 C187 348 188 336 185 324 Z"/>
      <path d="M205 352 C190 358 190 380 210 382 C214 372 212 360 205 352 Z"/>
    </g>

    <!-- Laurel Wreath Leaves (Right) -->
    <g fill="url(#leafGrad)">
      <path d="M322 190 C347 170 367 190 357 215 C347 210 332 200 322 190 Z"/>
      <path d="M334 220 C362 205 377 225 364 248 C352 242 340 232 334 220 Z"/>
      <path d="M340 255 C368 245 380 268 364 288 C352 280 342 268 340 255 Z"/>
      <path d="M338 290 C362 285 372 310 354 326 C344 316 338 304 338 290 Z"/>
      <path d="M327 324 C347 324 352 348 332 358 C325 348 324 336 327 324 Z"/>
      <path d="M307 352 C322 358 322 380 302 382 C298 372 300 360 307 352 Z"/>
    </g>

    <!-- Pillar: Base -->
    <g>
      <rect x="180" y="380" width="152" height="14" rx="7" fill="url(#marbleLight)"/>
      <rect x="195" y="366" width="122" height="14" rx="4" fill="url(#marbleShaft)"/>
      <rect x="210" y="354" width="92" height="12" rx="2" fill="url(#marbleLight)"/>
    </g>

    <!-- Pillar: Lower Shaft -->
    <g fill="url(#marbleShaft)">
      <rect x="216" y="280" width="80" height="74" rx="2"/>
      <!-- Fluting channels -->
      <line x1="228" y1="282" x2="228" y2="352" stroke="#bddad3" stroke-width="3" stroke-linecap="round"/>
      <line x1="242" y1="282" x2="242" y2="352" stroke="#bddad3" stroke-width="3" stroke-linecap="round"/>
      <line x1="256" y1="282" x2="256" y2="352" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="270" y1="282" x2="270" y2="352" stroke="#bddad3" stroke-width="3" stroke-linecap="round"/>
      <line x1="284" y1="282" x2="284" y2="352" stroke="#bddad3" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Pillar: Capital with Ionic Volutes (Top) -->
    <g fill="url(#marbleLight)">
      <rect x="186" y="112" width="140" height="16" rx="4"/>
      <!-- Left Volute scroll -->
      <circle cx="214" cy="142" r="28" fill="url(#marbleLight)" stroke="#bddad3" stroke-width="3"/>
      <circle cx="214" cy="142" r="14" fill="#eef8f6" stroke="#bddad3" stroke-width="2"/>
      <circle cx="214" cy="142" r="5" fill="#bddad3"/>
      <!-- Right Volute scroll -->
      <circle cx="298" cy="142" r="28" fill="url(#marbleLight)" stroke="#bddad3" stroke-width="3"/>
      <circle cx="298" cy="142" r="14" fill="#eef8f6" stroke="#bddad3" stroke-width="2"/>
      <circle cx="298" cy="142" r="5" fill="#bddad3"/>
      <!-- Architrave / egg-and-dart arch -->
      <path d="M214 126 L298 126 C280 134 232 134 214 126 Z" fill="#bddad3"/>
    </g>

    <!-- Clock Outer Ring / Bezel -->
    <circle cx="256" cy="226" r="76" fill="url(#clockBezel)"/>
    <circle cx="256" cy="226" r="71" fill="#1d937a"/>
    <circle cx="256" cy="226" r="67" fill="url(#clockDial)"/>

    <!-- Clock Ticks / Hour Marks -->
    <g fill="#1a7e6b">
      <circle cx="256" cy="168" r="2.5"/> <!-- 12 -->
      <circle cx="285" cy="176" r="2"/>   <!-- 1 -->
      <circle cx="306" cy="197" r="2"/>   <!-- 2 -->
      <circle cx="314" cy="226" r="2.5"/> <!-- 3 -->
      <circle cx="306" cy="255" r="2"/>   <!-- 4 -->
      <circle cx="285" cy="276" r="2"/>   <!-- 5 -->
      <circle cx="256" cy="284" r="2.5"/> <!-- 6 -->
      <circle cx="227" cy="276" r="2"/>   <!-- 7 -->
      <circle cx="206" cy="255" r="2"/>   <!-- 8 -->
      <circle cx="198" cy="226" r="2.5"/> <!-- 9 -->
      <circle cx="206" cy="197" r="2"/>   <!-- 10 -->
      <circle cx="227" cy="176" r="2"/>   <!-- 11 -->
    </g>

    <!-- Clock Hands (10:09) -->
    <!-- Hour hand pointing to 10 -->
    <line x1="256" y1="226" x2="228" y2="204" stroke="#1d8672" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Minute hand pointing to 2 (~10 mins) -->
    <line x1="256" y1="226" x2="292" y2="198" stroke="#1d8672" stroke-width="4" stroke-linecap="round"/>
    <!-- Center Pivot Pin -->
    <circle cx="256" cy="226" r="5" fill="#146052"/>
    <circle cx="256" cy="226" r="2.5" fill="#a4f0de"/>

    <!-- Gold Coin at bottom right -->
    <g filter="url(#softShadow)">
      <!-- Coin edge / 3D depth -->
      <ellipse cx="328" cy="385" rx="18" ry="14" transform="rotate(-30 328 385)" fill="#b88114"/>
      <!-- Coin face -->
      <ellipse cx="327" cy="384" rx="17" ry="13" transform="rotate(-30 327 384)" fill="url(#goldCoin)"/>
      <ellipse cx="327" cy="384" rx="14" ry="10" transform="rotate(-30 327 384)" fill="none" stroke="#fff1a8" stroke-width="1.2" opacity="0.8"/>
    </g>
  </g>
</svg>
